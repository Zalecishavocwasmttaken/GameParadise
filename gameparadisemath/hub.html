<style>

  .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .wrap { width: 100%; max-width: 1326px; margin: 0 auto; padding: 28px 24px 60px; }

  /* search */
  .search {
    display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 22px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    transition: border-color .25s, background .25s;
  }
  .search:focus-within { border-color: var(--accent); background: #232430; }
  .search .ic { color: var(--dim); flex: none; }
  #q { flex: 1; min-width: 0; height: 100%; background: none; border: 0; font-size: 1.05rem; }
  #q:focus { outline: none; }
  #q::placeholder { color: var(--dim); }

  /* right dock (sidebar) */
  body { padding-right: 88px; }
  .dock { position: fixed; z-index: 2; top: 50%; right: 16px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; padding: 8px; background: var(--panel); border-radius: 16px; }
  .dock a { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 12px; color: var(--dim); transition: background .2s, color .2s; }
  .dock a:hover { background: var(--panel-hover); color: var(--text); }
  .dock a.on { background: var(--accent); color: #fff; }
  .dock .ic { width: 26px; height: 26px; }

  /* card grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 24px; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 150px; padding: 24px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px; text-align: left;
    transition: transform .3s var(--ease), border-color .2s, background .2s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); background: #232430; }
  .badge {
    width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px;
    font-weight: 700; font-size: .95rem; letter-spacing: -0.01em;
    background: color-mix(in srgb, var(--c) 18%, var(--bg)); color: var(--c);
  }
  .card h3 { margin: 6px 0 0; font-size: 1.05rem; font-weight: 600; }
  .card p { margin: 0; color: var(--dim); font-size: .9rem; line-height: 1.5; }
  .star {
    position: absolute; top: 18px; right: 18px; width: 32px; height: 32px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 50%; color: var(--dim); transition: background .2s, color .2s;
  }
  .star:hover { background: var(--panel-hover); color: var(--text); }
  .star.on { color: var(--accent); }
  .star.on .ic { fill: var(--accent); }
  .empty { grid-column: 1 / -1; padding: 60px 0; text-align: center; color: var(--dim); }

  #toast { position: fixed; z-index: 5; left: 50%; bottom: 24px; transform: translate(-50%, 20px); padding: 10px 18px; background: var(--panel-hover); border-left: 3px solid var(--accent); border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s var(--ease); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    body { padding-right: 0; padding-bottom: 72px; }
    .dock { top: auto; bottom: 0; left: 0; right: 0; transform: none; flex-direction: row; justify-content: space-around; border-radius: 16px 16px 0 0; padding: 6px 4px; }
    .dock a { width: 40px; height: 44px; }
  }

/* ---------- decrypt (AES-GCM, key from HUB_KEY; same scheme as hubencrypter.html) ---------- */
const te = new TextEncoder(), td = new TextDecoder();
let keyP = null;
function getKey() {
  return keyP || (keyP = crypto.subtle.importKey("raw", te.encode(HUB_KEY), "PBKDF2", false, ["deriveKey"])
    .then(km => crypto.subtle.deriveKey({ name: "PBKDF2", salt: te.encode("hub-salt-v1"), iterations: 100000, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"])));
}
async function decrypt(blob) {
  const s = blob.replace(/-/g, "+").replace(/_/g, "/");
  const raw = Uint8Array.from(atob(s + "=".repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, await getKey(), raw.slice(12));
  return td.decode(pt);
}

/* ---------- hider (runs INSIDE the loaded site) ---------- */
function hider(C){
 const URLRE=/jsdelivr|esm\.sh|unpkg|statically|githack|staticdelivr|jsdmirror|onmicrosoft|b-cdn|script\.google|sites\.google|amazonaws|quizizz|wayground/i;

  const d=document;

  d.querySelectorAll('[class$="-section"]').forEach(s=>{const p=s.parentElement;if(!p||seen.has(p))return;seen.add(p);
   if([].filter.call(p.children,c=>/-section$/.test(cls(c))).length>1)hide(p)});

   if(t.length<20&&e.children.length<4&&/^\W*links?\W*$/i.test(t))hide(e)});

 }
 let q=0;const run=()=>{if(!q)q=requestAnimationFrame(()=>{q=0;sweep()})};
 sweep();
 new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class","hidden"]});
 document.addEventListener("DOMContentLoaded",sweep);
 ["write","writeln"].forEach(n=>{const o=document[n];if(o.__w)return;
  const f=function(){const a=[].slice.call(arguments);if(document.readyState!=="loading")a.push(PAY);return o.apply(document,a)};
  f.__w=1;document[n]=f});
}

/* ---------- cloak opener: about:blank tab + iframe, hider injected ----------
   Not locked: fetch the file, prepend <base> + hider, load it via srcdoc. If the fetch is
   blocked (CORS) it falls back to a plain iframe src and the hider does not run.
   Locked: plain iframe src on the CDN origin (real isolation), so no hider. */
async function openCloak(x) {
  const url = x._u;
  if (!url) { say("No valid link for " + x.name + ". Run it through hubencrypter.html with the same key."); return; }
  const w = window.open("about:blank", "_blank");      // must happen before any await
  if (!w) { say("Popup blocked. Allow popups for this page."); return; }
  const lock = !!x.lock;
  const csp = lock ? '<meta http-equiv="Content-Security-Policy" content="frame-src ' + ALLOW.join(" ") + '">' : "";
  w.document.open();
  w.document.write('<!doctype html><html><head>' + csp + '<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style></head><body></body></html>');
  w.document.close();
  const f = w.document.createElement("iframe");
  f.setAttribute("sandbox", lock ? SB_LOCK : SB_OPEN);
  f.setAttribute("allow", "fullscreen; autoplay; clipboard-write; gamepad");
  let html = null;
  if (!lock && (x.hide !== false || x.storage)) {
    try { const r = await fetch(url); if (r.ok) html = await r.text(); } catch (e) {}
  }
  if (html !== null) {
    const cfg = Object.assign({}, HIDE_CFG, x.hide || {});
    const store = Object.entries(x.storage || {}).map(([k, v]) => 'try{localStorage.setItem(' + JSON.stringify(k) + ',' + JSON.stringify(v) + ')}catch(e){}').join(";");
    const hide = x.hide === false ? "" : '<script>(' + hider + ')(' + JSON.stringify(cfg) + ')<\/script>';
    f.srcdoc = '<base href="' + url.replace(/"/g, "%22") + '">' + (store ? '<script>' + store + '<\/script>' : '') + hide + html;
  } else {
    f.src = url;
  }
  w.document.body.appendChild(f);
}

/* ---------- site viewer ----------
   The viewer lives in a CLOSED shadow root so document.querySelector and
   page scripts can't reach the iframe, and the iframe src is the encoded
   proxy path, never the real URL. This is obscurity, not security: anyone
   with devtools can still see network traffic. */
let viewerHost = null, viewerFrame = null, viewerState = null;

function buildViewer() {
  viewerHost = document.createElement("div");
  const root = viewerHost.attachShadow({ mode: "closed" });
  root.innerHTML = `
    <style>
      :host { all: initial; }
      .v { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; background: #131318; font: 14px/1.4 system-ui, sans-serif; color: #fff; }
      .bar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; background: #1e1f27; flex: none; }
      .bar button { height: 32px; padding: 0 14px; background: #272835; border: 0; border-radius: 16px; color: #fff; cursor: pointer; }
      .bar button:hover { background: #2b2c38; }
      .bar .back { background: #fb542b; }
      .bar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9a9bb0; padding: 0 8px; }
      iframe { flex: 1; width: 100%; border: 0; background: #fff; }
    </style>
    <div class="v">
      <div class="bar"><button class="back">Back</button><span></span><button class="rl">Reload</button></div>
      <iframe allow="fullscreen; autoplay; clipboard-write; gamepad" allowfullscreen></iframe>
    </div>`;
  viewerFrame = root.querySelector("iframe");
  viewerState = { title: root.querySelector("span") };
  root.querySelector(".back").onclick = closeViewer;
  root.querySelector(".rl").onclick = () => { try { viewerFrame.contentWindow.location.reload(); } catch (e) {} };
  document.body.appendChild(viewerHost);
}
function closeViewer() {
  if (!viewerHost) return;
  viewerFrame.src = "about:blank";
  viewerHost.remove(); viewerHost = viewerFrame = viewerState = null;
  document.documentElement.style.overflow = "";
}
async function openSite(x) {
  if (x.enc) return openCloak(x);
  if (/CHANGE_ME/.test(x.url)) { say("Set a real URL for " + x.name + " in GAMES."); return; }
  buildViewer();
  viewerState.title.textContent = x.name;
  document.documentElement.style.overflow = "hidden";
  try {
    if (OPEN_ENGINE === "uv") {
      try { await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(r, 3000))]); } catch (e) {}
      viewerFrame.src = __uv$config.prefix + __uv$config.encodeUrl(x.url);
    } else if (OPEN_ENGINE === "scramjet") {
      if (!sj) {
        const { ScramjetController } = $scramjetLoadController();
        sj = new ScramjetController({ prefix: SCRAMJET.prefix, files: SCRAMJET.files });
        await sj.init();
      }
      sj.createFrame(viewerFrame).go(x.url);
    } else {
      viewerFrame.src = x.url;
    }
  } catch (e) {
    console.error(e); closeViewer(); say("Failed to load " + x.name + ". Try a different OPEN_ENGINE.");
  }
}

/* ---------- anti-inspect ---------- */
(function () {
  const kick = () => { if (ANTI_INSPECT) location.replace(KICK_URL); };

  addEventListener("keydown", e => {
    if (!ANTI_INSPECT) return;
    const k = (e.key || "").toLowerCase();
    const devtools =
      e.key === "F12" ||
      (e.ctrlKey && e.shiftKey && (k === "i" || k === "j" || k === "c")) ||   // Ctrl+Shift+I / J / C
      (e.metaKey && e.altKey && (k === "i" || k === "j" || k === "c")) ||     // Cmd+Opt+I / J / C
      (e.ctrlKey && k === "u");                                               // view-source
    if (devtools) { e.preventDefault(); e.stopImmediatePropagation(); kick(); }
  }, true);

  addEventListener("contextmenu", e => { if (ANTI_INSPECT && BLOCK_RIGHT_CLICK) e.preventDefault(); }, true);

  setInterval(() => {
    if (!ANTI_INSPECT || !DETECT_DOCKED_TOOLS) return;
    if (outerWidth - innerWidth > 200 || outerHeight - innerHeight > 200) kick();
  }, 1000);
})();

renderGrid();
resolveLinks();
</script>
